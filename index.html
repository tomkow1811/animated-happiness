<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Grant fEC & Indexation Estimator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: 'Roboto Mono', ui-monospace, Menlo, Consolas, monospace;
      --bg: #f6f8fa;
      --card-bg: #ffffff;
      --text: #24292f;
      --text-muted: #57606a;
      --accent: #193247;
      --accent-light: #f0f4f8;
      --border: #d0d7de;
      --border-focus: #0969da;
      --alert-warn: #cf222e;
      --success: #1a7f37;
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 48px 16px 80px;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 660px;
      width: 100%;
      position: relative;
    }

    /* Staggered load-in keyframes */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    header {
      margin-bottom: 24px;
      animation: fadeInUp 0.5s var(--ease-out-expo) forwards;
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }

    header p {
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 2px 10px rgba(31, 35, 40, 0.04);
      animation: fadeInUp 0.6s var(--ease-out-expo) 0.08s forwards;
      opacity: 0;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.76rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      transition: color 0.15s ease;
    }

    .field:focus-within label {
      color: var(--border-focus);
    }

    input, select {
      font-family: var(--font-mono);
      font-size: 0.92rem;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #fafbfc;
      color: var(--text);
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    input:hover, select:hover {
      border-color: #8c959f;
    }

    input:focus, select:focus {
      border-color: var(--border-focus);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.15);
      transform: translateY(-1px);
    }

    .module-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 14px 0 8px;
      cursor: pointer;
      user-select: none;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--accent);
      transition: opacity 0.15s ease;
    }

    .module-toggle:hover {
      opacity: 0.85;
    }

    .module-toggle input[type="checkbox"] {
      cursor: pointer;
      accent-color: var(--accent);
      transform: scale(1.05);
      transition: transform 0.15s ease;
    }

    /* Smooth accordion drawers */
    .drawer {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.3s var(--ease-out-expo);
      overflow: hidden;
    }

    .drawer.open {
      grid-template-rows: 1fr;
    }

    .drawer-content {
      min-height: 0;
    }

    .optional-box {
      background: #fafbfc;
      border: 1px dashed var(--border);
      border-radius: 6px;
      padding: 14px;
      margin: 8px 0 16px;
    }

    .error-hint {
      font-size: 0.76rem;
      color: var(--alert-warn);
      margin-top: 4px;
      display: none;
      animation: fadeInUp 0.2s ease;
    }

    /* Summary Card with Rolling Numbers */
    .summary-card {
      background: var(--accent-light);
      border: 1px solid #d8e2ec;
      border-radius: 6px;
      padding: 20px;
      margin: 24px 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .summary-card:hover {
      border-color: #b9d0e6;
      box-shadow: 0 4px 12px rgba(25, 50, 71, 0.04);
    }

    .summary-block {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .summary-label {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
      color: var(--accent);
    }

    .summary-value {
      font-family: var(--font-mono);
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .summary-value.secondary {
      font-size: 1.12rem;
      color: #3b5064;
    }

    .section-header {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin-top: 24px;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .allocation-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
      margin-bottom: 10px;
      animation: fadeInUp 0.25s var(--ease-out-expo) forwards;
    }

    .alloc-warning {
      font-size: 0.78rem;
      color: var(--alert-warn);
      margin-bottom: 12px;
      font-weight: 500;
      display: none;
      animation: fadeInUp 0.2s ease;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      margin-bottom: 24px;
      font-size: 0.88rem;
    }

    th {
      text-align: left;
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 8px 6px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }

    td {
      padding: 9px 6px;
      border-bottom: 1px solid #edf0f2;
      transition: background-color 0.15s ease;
    }

    tr:hover td {
      background-color: #fafbfc;
    }

    td.mono, th.mono {
      font-family: var(--font-mono);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .btn {
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--accent);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s var(--ease-out-expo);
    }

    .btn:hover {
      background: #f6f8fa;
      border-color: #8c959f;
      transform: translateY(-1px);
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .btn-link {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-family: var(--font-mono);
      cursor: pointer;
      text-decoration: underline;
      transition: color 0.15s ease;
    }

    .btn-link:hover {
      color: var(--accent);
    }

    .copy-status {
      font-size: 0.8rem;
      color: var(--success);
      font-weight: 500;
      opacity: 0;
      transform: translateX(-4px);
      transition: all 0.2s ease;
      display: inline-block;
    }

    .copy-status.visible {
      opacity: 1;
      transform: translateX(0);
    }

    .disclaimer {
      font-size: 0.78rem;
      line-height: 1.5;
      color: #6e7781;
      border-left: 2px solid var(--border);
      padding-left: 12px;
      margin-top: 24px;
    }

    /* Modal Animation */
    #gameModal {
      display: flex;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s var(--ease-out-expo);
    }

    #gameModal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .game-card {
      background: #ffffff;
      border-radius: 8px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.2);
      transform: scale(0.96) translateY(8px);
      transition: transform 0.25s var(--ease-out-expo);
    }

    #gameModal.open .game-card {
      transform: scale(1) translateY(0);
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .game-header h3 {
      font-size: 1.05rem;
      color: var(--accent);
    }

    canvas {
      background: #111a24;
      border-radius: 4px;
      display: block;
      width: 100%;
      height: 240px;
      cursor: crosshair;
    }

    .game-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 0.78rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    @media (max-width: 540px) {
      .grid-2, .summary-card { grid-template-columns: 1fr; }
      .allocation-row { grid-template-columns: 1fr; }
      .action-bar { flex-direction: column; align-items: flex-start; gap: 10px; }
    }
  </style>
</head>

Here are the four key animations added to this build:

1. **Live Number Rolling (Slot-machine / Count-up effect):** Whenever an input or slider changes, the currency figures roll smoothly to their new values over 250ms rather than snapping abruptly.
2. **Smooth Expand & Collapse:** The co-funder allocations and 100% exception trays slide in and out with CSS cubic-bezier easing instead of appearing as a sudden jump.
3. **Table Row Staggered Cascades:** When changing durations or multi-funder numbers, the breakdown rows slide up and fade into place with a subtle stagger.
4. **Tactile Micro-interactions:** Focus rings expand softly on inputs, and the "Copy Summary" button gives immediate visual spring feedback on click.
